name: test

on:
  push:
    branches:
      - master
      - feature/setup-foundation
      - feature/pass-cloud-help
      - feature/pass-diff
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - name: Check gofmt
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "Unformatted Go files:"
            printf '%s\n' "$files"
            exit 1
          fi
      - run: go test ./...
      - run: go vet ./...
