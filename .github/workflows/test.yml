name: test

on:
  push:
    branches:
      - master
      - feature/setup-foundation
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false
      - run: gofmt -d .
      - run: go test ./...
      - run: go vet ./...
